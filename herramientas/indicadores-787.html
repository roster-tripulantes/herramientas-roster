<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Indicadores 787</title>
<style>
:root{--bg:#f3f4f6;--card:#ffffff;--ink:#18212f;--muted:#5b6574;--line:#d9dde3;--accent:#c8102e;--accent-ink:#ffffff;--board:#16202c;--gold:#f3c94b;--bad:#b3121e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#18202b;--ink:#e7ebf0;--muted:#9aa5b3;--line:#2a3542;--accent:#ff4d5e;--accent-ink:#1a0b0e;--board:#0a0e13;--bad:#ff6b73;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",Roboto,Arial,sans-serif;display:grid;grid-template-rows:auto 1fr}
header{background:var(--board);color:#eef2f6;padding:22px max(16px,env(safe-area-inset-left))}
header .k{font:500 12px/1 ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
header h1{margin:8px 0 0;font:700 26px/1.1 "Arial Narrow",Arial,sans-serif;letter-spacing:.01em}
main{display:grid;place-items:start center;padding:40px 16px}
form{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
form h2{margin:0;font-size:19px}
form p{margin:0;color:var(--muted);font-size:14px}
label.f{display:grid;gap:6px;font-weight:600;font-size:14px}
.row{display:flex;gap:8px}
input[type=password],input[type=text]{flex:1;min-width:0;font:16px ui-monospace,Consolas,monospace;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
button{font:600 15px "Segoe UI",Roboto,Arial,sans-serif;border-radius:8px;cursor:pointer;padding:10px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.6;cursor:wait}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;font-weight:600;min-height:1.2em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header><div class="k">Programación de tripulantes</div><h1>Herramientas equipo Roster</h1></header>
<main>
  <form id="f" autocomplete="off">
    <h2>Acceso del equipo</h2>
    <p>Escribe la clave de acceso que te compartió el equipo Roster. Se pide una sola vez en este navegador.</p>
    <label class="f" for="pw">Clave de acceso
      <span class="row"><input id="pw" type="password" spellcheck="false" autocapitalize="off" required><button type="button" id="ver" aria-label="Mostrar u ocultar la clave">Ver</button></span>
    </label>
    <label class="chk"><input type="checkbox" id="rec" checked> Recordar la clave en este navegador</label>
    <button class="go" id="go" type="submit">Entrar</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</main>

<script>
(function(){
  var D=JSON.parse(document.getElementById('datos').textContent), K=D.k, P=D.p, LS='roster-acceso-v1';
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
  function enc(u){var s='';for(var i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
  function leer(){try{return localStorage.getItem(LS)||sessionStorage.getItem(LS);}catch(e){return null;}}
  function guardar(v,rec){try{(rec?localStorage:sessionStorage).setItem(LS,v);}catch(e){}}
  function olvidar(){try{localStorage.removeItem(LS);sessionStorage.removeItem(LS);}catch(e){}}
  async function privadaDesdeClave(pw){
    var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var kek=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(K.salt),iterations:K.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(K.iv)},kek,b64(K.ct)));
  }
  function importar(raw){return crypto.subtle.importKey('pkcs8',raw,{name:'RSA-OAEP',hash:'SHA-256'},false,['unwrapKey']);}
  async function abrirCon(priv,o){
    var k=await crypto.subtle.unwrapKey('raw',b64(o.wk),priv,{name:'RSA-OAEP'},{name:'AES-GCM'},false,['decrypt']);
    var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(o.iv)},k,b64(o.ct));
    if(!o.gz) return pt;
    return new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  }
  async function mostrar(priv){
    window.__roster={abrir:function(o){return abrirCon(priv,o);},olvidar:olvidar};
    var html=new TextDecoder().decode(await abrirCon(priv,P));
    document.open();document.write(html);document.close();
  }
  var f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
  document.getElementById('ver').addEventListener('click',function(){pw.type=pw.type==='password'?'text':'password';pw.focus();});
  f.addEventListener('submit',async function(e){
    e.preventDefault();err.textContent='';go.disabled=true;go.textContent='Abriendo…';
    try{
      var raw=await privadaDesdeClave(pw.value.trim());
      var priv=await importar(raw);
      guardar(enc(raw),document.getElementById('rec').checked);
      await mostrar(priv);
    }catch(x){err.textContent='La clave no es correcta. Revísala e intenta de nuevo.';go.disabled=false;go.textContent='Entrar';pw.select();}
  });
  (async function(){
    var s=leer();
    if(s){try{await mostrar(await importar(b64(s)));return;}catch(x){olvidar();}}
    pw.focus();
  })();
})();
</script>
